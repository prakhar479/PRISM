  - {task: entity_track, layer: 12, sae: {width: 16k}, role: exploratory, fit_families: [ot_en], eval_families: [ot_fr]}
  - {task: add_chain, layer: 18, sae: {width: 16k}, role: exploratory, fit_families: [rs_en], eval_families: [rs_en]}
  - {task: add_chain, layer: 18, sae: {width: 16k}, role: exploratory, fit_families: [rs_hi], eval_families: [rs_hi]}
  - {task: add_chain, layer: 18, sae: {width: 16k}, role: exploratory, fit_families: [rs_hi_latn], eval_families: [rs_hi_latn]}
