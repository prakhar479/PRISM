# E14 (P3): multilingual task gap (M2) and English-direction transfer (M3), every language and task at once. Whether a row may be
# READ is decided in analysis: Gate A (E13 viable), Gate B (accuracy within 10 points of English), validated templates
# (data/lang/signoff.json). Rows that fail are kept in the data and rejected by scripts/make_e14.py (two-pass plan, 2026-11-16).
exp_id: E14
name: multilingual_gap
description: >-
  E2 baselines and repair / repair_mean per (task, language family): fit and evaluate on the same language (native), and fit on
  English, evaluate on the language (transfer, M3). Object tracking L12, running sum L18, people-cities L12; 16k pilot variants.
model_revision: c5ebcd40d208330abc697524c919956e692655cf
prompt_sets: {entity_track: prompt_sets/entity_track_e13.jsonl.gz, add_chain: prompt_sets/add_chain_e13.jsonl.gz,
              people_cities: prompt_sets/people_cities_e13.jsonl.gz}
cells:
  - {task: entity_track, layer: 12, sae: {width: 16k}, role: exploratory, fit_families: [ot_en], eval_families: [ot_en]}
  - {task: entity_track, layer: 12, sae: {width: 16k}, role: exploratory, fit_families: [ot_hi], eval_families: [ot_hi]}
  - {task: entity_track, layer: 12, sae: {width: 16k}, role: exploratory, fit_families: [ot_hi_latn], eval_families: [ot_hi_latn]}
  - {task: entity_track, layer: 12, sae: {width: 16k}, role: exploratory, fit_families: [ot_hinglish], eval_families: [ot_hinglish]}
