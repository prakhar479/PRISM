n_train: 150
n_test: 150
filters: [f_none, f_A_correct, f_pilot]
fit_filter: f_pilot
conditions: [feat_A_errB, feat_B_errA, feat_B_noise, feat_A_zero, feat_A_meanTask, feat_A_meanPos, feat_A_noise]
noise_seeds: [0]
directions:
  conditions: [repair, repair_mean]
  ranks: [0, 1, 2, 4]
  estimators: [pca_pooled, answer_sep]
  sources: [same_task]
  random_seeds: 20
  r_max: 32
bootstrap: 1000
seed: 0
