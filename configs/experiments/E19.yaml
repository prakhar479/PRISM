# E19 (exploratory, post hoc 2026-11-18): steering dose-response. E10's Q2 failed everywhere: running sum moved <= 20 % (DAS x4)
# and object-tracking steering was matched by random directions (p95 58-90 % at x1). Scales from 0.25 to 16: is there a scale
# where running sum reaches 50 %, and a small scale where object-tracking U beats random? Same cells as E10.
exp_id: E19
name: steering_dose
description: >-
  Steering x_B + s |m| P_U m / |P_U m| (as E10) at s in {0.25, 0.5, 1, 2, 4, 8, 16}; U from pca_pooled, answer_sep, DAS rank 4
  and 8 (E9 rotations) and DAS rank 8 trained 10 epochs; 20 matched-norm random U per rank. RS L18, OT L12, people-cities L12.
model_revision: c5ebcd40d208330abc697524c919956e692655cf
prompt_sets: {add_chain: prompt_sets/add_chain_pilot.jsonl.gz, entity_track: prompt_sets/entity_track_pilot.jsonl.gz,
              people_cities: prompt_sets/people_cities_en.jsonl.gz}
cells:
  - {task: add_chain, layer: 18, sae: {width: 16k}, role: exploratory}
  - {task: entity_track, layer: 12, sae: {width: 16k}, role: exploratory}
  - {task: people_cities, layer: 12, sae: {width: 16k}, role: exploratory, fit_families: [pc_en], eval_families: [pc_en]}
n_train: 300
n_test: 150
filters: [f_none, f_A_correct, f_pilot]
fit_filter: f_pilot
conditions: []
noise_seeds: [0]
directions:
  conditions: [steer_x0.25, steer_x0.5, steer_x1, steer_x2, steer_x4, steer_x8, steer_x16]
  ranks: [0, 1, 4, 8]
  estimators: [pca_pooled, answer_sep, das4, das8, das8_e10]
  sources: [same_task]
  random_seeds: 20
  r_max: 32
bootstrap: 1000
seed: 0
notes:
  - "q2_* columns in E19_steering.csv apply E10's rule mechanically; E19 is exploratory and does not revisit Q2."
