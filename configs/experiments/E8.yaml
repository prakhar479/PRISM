# E8 fill (P1, release 2): repair specificity on every pilot-grid cell (4 tasks x L4-L20) and the E6 layers, with all
# three controls in ONE run per cell (handoff 9 E8; PREREGISTRATION.md "repair specificity"): other-task directions
# (every other task), generic-text directions, and >= 20 random U per rank. Release 1 had controls split across runs
# (E1_repair: other/generic with 3 random seeds; E2: 20 random seeds, no other/generic; E6: 5 seeds) -> tables/E8_*.
