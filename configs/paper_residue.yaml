# Paper tier 1/3 (~1 h on 8 GB, estimate): THE RESIDUE. Where the SAE misses part of the causal state and
# whether that missing piece is low-rank and task-specific. Pilot: entity_track L12 (gap 0.25, rank-1 error
# direction closes 51%) and add_chain L18 (gap 0.12, rank 1 closes 53%); IOI is the control.
base: default_config.yaml
run_name: paper_residue
tasks: [entity_track, add_chain, ioi_control]
n_train: 300
n_test: 150
layers: [10, 12, 14, 18]
widths: ["16k"]
geometry_layers: [10, 12, 14, 18]
geometry_widths: ["16k"]
exp1_positions: [from_diff]
exp3_positions: [from_diff]
exp1_extras: [controls]
exp3_methods: [unsupervised_svd, supervised_centroid_svd, random_subspace, generic_text_svd, transfer]
ranks: [0, 1, 2, 4, 8, 16, 32]
random_seeds: 3
noise_seeds: 2
bootstrap: 1000
latent_probe_cols: 2048
generic_text: {dataset: NeelNanda/pile-10k, n_docs: 100, seq_len: 128, skip_positions: 4, fidelity_batches: 2}
runtime: {max_batch_tokens: 2048}  # below the 8 GB auto value (~3k): headroom for the longer 8-shot prompts
