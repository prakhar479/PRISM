# Tier 3 (~1.5-2 h): generic-text vs task-specific error subspaces, bigger samples, second data seed.
base: default_config.yaml
run_name: tier3_expansions
seed: 1
n_train: 1000
n_test: 500
layers: [8, 12, 16]
widths: ["16k"]
geometry_layers: [8, 12, 16]
geometry_widths: ["16k", "65k"]
exp1_positions: [last, from_diff]
exp3_positions: [last, from_diff]
exp3_methods: [unsupervised_svd, supervised_centroid_svd, random_subspace, span_svd, generic_text_svd, transfer]
generic_text: {dataset: NeelNanda/pile-10k, n_docs: 400, seq_len: 128, skip_positions: 4, fidelity_batches: 4}
