[pytest]
testpaths = tests
markers =
    gpu: needs a CUDA GPU (skipped on DEV)
    realmodel: needs real gemma-2-2b weights (skipped unless HL_REALMODEL=1)
    golden: needs a golden fixture archive (incoming/R2) and the 16k SAE params
    realtokenizer: needs the real gemma-2-2b tokenizer (HF access)
    slow: takes more than a few seconds
