# The complete remaining compute in ONE queue (2026-11-17): release 3 (E12 fidelity, E13 behaviour) + their extensions, the
# final pass (E9, E10, E11, E14) and the exploratory / redundant runs (E9b, E10b, E2r, E16). E4_1m (two 1m SAEs, ~36 GiB of
# downloads) is in queue/extra-1m-server.yaml, to run only where the disk allows. Run with:
#   sbatch scripts/slurm_final.sbatch            (docs/FINAL_PASS_RUNBOOK.md)
# Priorities: confirmatory first (E9, E10 on running sum L18), then E14 and the cheap release-3 jobs E14's analysis needs,
# then exploratory. Stage 1 of experiments sharing cache entries is chained so each entry has one writer.
tag: complete-server
profile: server
parallel: true
prefetch:                       # SAEs that script jobs (E12) use without an experiment config naming them
  model_revision: c5ebcd40d208330abc697524c919956e692655cf
  saes: [[6, 16k, 70], [12, 16k, 82], [18, 16k, 74], [24, 16k, 73]]
jobs:
  - {id: prefetch, kind: script, script: scripts/run_prefetch.py, args: [--queue, queue/complete-server.yaml]}
  - {id: preflight, kind: script, script: scripts/run_preflight.py, gpu: all,
     args: [--queue, queue/complete-server.yaml, --golden, golden/R2, --per-gpu], depends_on: [prefetch]}

  # ---- release 3: E12 fidelity (L12, L18) and E13 behaviour (test split); English first
  - {id: E12_en, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 7, args: [--sets, "en_pilot100,en_pile", --layers, "12", "18"], depends_on: [preflight]}
  - {id: E12_hi_deva_web, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 7, args: [--sets, hi_deva_web, --layers, "12", "18"], depends_on: [preflight]}
  - {id: E12_fr_web, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 7, args: [--sets, fr_web, --layers, "12", "18"], depends_on: [preflight]}
  - {id: E12_hinglish, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 7, args: [--sets, hinglish_phinc, --layers, "12", "18"], depends_on: [preflight]}
  - {id: E12_hi_dakshina, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 7, args: [--sets, "hi_deva_dakshina,hi_latn_dakshina", --layers, "12", "18"], depends_on: [preflight]}
  - {id: E12_ta_web, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 5, args: [--sets, ta_web, --layers, "12", "18"], depends_on: [preflight]}
  - {id: E12_bn_web, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 5, args: [--sets, bn_web, --layers, "12", "18"], depends_on: [preflight]}
  - {id: E12_ta_dakshina, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 5, args: [--sets, "ta_taml_dakshina,ta_latn_dakshina", --layers, "12", "18"], depends_on: [preflight]}
  - {id: E12_bn_dakshina, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 5, args: [--sets, "bn_beng_dakshina,bn_latn_dakshina", --layers, "12", "18"], depends_on: [preflight]}
  - {id: E13_en, kind: script, script: scripts/run_behaviour.py, gpu: one, priority: 8, args: [--langs, en], depends_on: [preflight]}
  - {id: E13_hi, kind: script, script: scripts/run_behaviour.py, gpu: one, priority: 8, args: [--langs, hi], depends_on: [preflight]}
  - {id: E13_hi_latn, kind: script, script: scripts/run_behaviour.py, gpu: one, priority: 8, args: [--langs, hi_latn], depends_on: [preflight]}
  - {id: E13_hinglish, kind: script, script: scripts/run_behaviour.py, gpu: one, priority: 8, args: [--langs, hinglish], depends_on: [preflight]}
  - {id: E13_fr, kind: script, script: scripts/run_behaviour.py, gpu: one, priority: 8, args: [--langs, fr], depends_on: [preflight]}

  # ---- release-3 extensions (exploratory): fidelity depth profile at L6 and L24; behaviour on the train split
  - {id: E12d_en, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 2, args: [--sets, "en_pilot100,en_pile", --layers, "6", "24"], depends_on: [preflight]}
  - {id: E12d_hi_deva_web, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 2, args: [--sets, hi_deva_web, --layers, "6", "24"], depends_on: [preflight]}
  - {id: E12d_fr_web, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 2, args: [--sets, fr_web, --layers, "6", "24"], depends_on: [preflight]}
  - {id: E12d_hinglish, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 2, args: [--sets, hinglish_phinc, --layers, "6", "24"], depends_on: [preflight]}
  - {id: E12d_hi_dakshina, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 2, args: [--sets, "hi_deva_dakshina,hi_latn_dakshina", --layers, "6", "24"], depends_on: [preflight]}
  - {id: E13t_en, kind: script, script: scripts/run_behaviour.py, gpu: one, priority: 2, args: [--langs, en, --split, train], depends_on: [preflight]}
  - {id: E13t_hi, kind: script, script: scripts/run_behaviour.py, gpu: one, priority: 2, args: [--langs, hi, --split, train], depends_on: [preflight]}
  - {id: E13t_hi_latn, kind: script, script: scripts/run_behaviour.py, gpu: one, priority: 2, args: [--langs, hi_latn, --split, train], depends_on: [preflight]}
  - {id: E13t_hinglish, kind: script, script: scripts/run_behaviour.py, gpu: one, priority: 2, args: [--langs, hinglish, --split, train], depends_on: [preflight]}
  - {id: E13t_fr, kind: script, script: scripts/run_behaviour.py, gpu: one, priority: 2, args: [--langs, fr, --split, train], depends_on: [preflight]}

  # ---- stage 1 (one writer per shared entry)
  - {id: E9_s1, config: configs/experiments/E9.yaml, stage: "1", priority: 10, depends_on: [preflight]}
  - {id: E14_s1, config: configs/experiments/E14.yaml, stage: "1", priority: 9, depends_on: [preflight]}
  - {id: E9b_s1, config: configs/experiments/E9b.yaml, stage: "1", priority: 4, depends_on: [preflight]}
  - {id: E11_s1, config: configs/experiments/E11.yaml, stage: "1", priority: 6, depends_on: [E9_s1]}
  - {id: E16_s1, config: configs/experiments/E16.yaml, stage: "1", priority: 5, depends_on: [E9_s1]}
  - {id: E10_s1, config: configs/experiments/E10.yaml, stage: "1", priority: 10, depends_on: [E9_s1, E11_s1]}
  - {id: E2r_s1, config: configs/experiments/E2r.yaml, stage: "1", priority: 3, depends_on: [E9_s1, E11_s1]}
  - {id: E10b_s1, config: configs/experiments/E10b.yaml, stage: "1", priority: 4, depends_on: [E9b_s1]}

  # ---- stage 2: SAE groups split over the GPUs
  - {id: E9_s2, config: configs/experiments/E9.yaml, stage: "2", slices: auto, priority: 10, depends_on: [E9_s1]}
  - {id: E14_s2, config: configs/experiments/E14.yaml, stage: "2", slices: auto, priority: 9, depends_on: [E14_s1]}
  - {id: E9b_s2, config: configs/experiments/E9b.yaml, stage: "2", slices: auto, priority: 4, depends_on: [E9b_s1]}
  - {id: E11_s2, config: configs/experiments/E11.yaml, stage: "2", slices: auto, priority: 6, depends_on: [E11_s1, E9_s2]}
  - {id: E16_s2, config: configs/experiments/E16.yaml, stage: "2", slices: auto, priority: 5, depends_on: [E16_s1, E9_s2]}
  - {id: E10_s2, config: configs/experiments/E10.yaml, stage: "2", slices: auto, priority: 10, depends_on: [E10_s1, E9_s2, E11_s2]}
  - {id: E2r_s2, config: configs/experiments/E2r.yaml, stage: "2", slices: auto, priority: 3, depends_on: [E2r_s1, E9_s2, E11_s2]}
  - {id: E10b_s2, config: configs/experiments/E10b.yaml, stage: "2", slices: auto, priority: 4, depends_on: [E10b_s1, E9b_s2]}

  # ---- stage 3: claiming workers (E9 / E9b first: they train the DAS rotations E10 / E10b read from the cache)
  - {id: E9_s3, config: configs/experiments/E9.yaml, stage: "3", workers: auto, priority: 10, depends_on: [E9_s2]}
  - {id: E10_s3, config: configs/experiments/E10.yaml, stage: "3", workers: auto, priority: 9, depends_on: [E10_s2, E9_s3]}
  - {id: E14_s3, config: configs/experiments/E14.yaml, stage: "3", workers: auto, priority: 8, depends_on: [E14_s2]}
  - {id: E11_s3, config: configs/experiments/E11.yaml, stage: "3", workers: auto, priority: 6, depends_on: [E11_s2]}
  - {id: E16_s3, config: configs/experiments/E16.yaml, stage: "3", workers: auto, priority: 5, depends_on: [E16_s2]}
  - {id: E9b_s3, config: configs/experiments/E9b.yaml, stage: "3", workers: auto, priority: 4, depends_on: [E9b_s2]}
  - {id: E10b_s3, config: configs/experiments/E10b.yaml, stage: "3", workers: auto, priority: 3, depends_on: [E10b_s2, E9b_s3]}
  - {id: E2r_s3, config: configs/experiments/E2r.yaml, stage: "3", workers: auto, priority: 3, depends_on: [E2r_s2]}

  # ---- finalize (CPU)
  - {id: E9_fin, config: configs/experiments/E9.yaml, stage: "3", gpu: none, args: [--finalize-only], depends_on: [E9_s3]}
  - {id: E10_fin, config: configs/experiments/E10.yaml, stage: "3", gpu: none, args: [--finalize-only], depends_on: [E10_s3]}
  - {id: E14_fin, config: configs/experiments/E14.yaml, stage: "3", gpu: none, args: [--finalize-only], depends_on: [E14_s3]}
  - {id: E11_fin, config: configs/experiments/E11.yaml, stage: "3", gpu: none, args: [--finalize-only], depends_on: [E11_s3]}
  - {id: E16_fin, config: configs/experiments/E16.yaml, stage: "3", gpu: none, args: [--finalize-only], depends_on: [E16_s3]}
  - {id: E9b_fin, config: configs/experiments/E9b.yaml, stage: "3", gpu: none, args: [--finalize-only], depends_on: [E9b_s3]}
  - {id: E10b_fin, config: configs/experiments/E10b.yaml, stage: "3", gpu: none, args: [--finalize-only], depends_on: [E10b_s3]}
  - {id: E2r_fin, config: configs/experiments/E2r.yaml, stage: "3", gpu: none, args: [--finalize-only], depends_on: [E2r_s3]}

  - {id: bundle, kind: script, script: scripts/bundle_results.py, args: [--tag, complete-server, --queue, queue/complete-server.yaml], after_failed: true, depends_on: [E12_en, E12_hi_deva_web, E12_fr_web, E12_hinglish, E12_hi_dakshina, E12_ta_web, E12_bn_web, E12_ta_dakshina, E12_bn_dakshina, E13_en, E13_hi, E13_hi_latn, E13_hinglish, E13_fr, E12d_en, E12d_hi_deva_web, E12d_fr_web, E12d_hinglish, E12d_hi_dakshina, E13t_en, E13t_hi, E13t_hi_latn, E13t_hinglish, E13t_fr, E9_fin, E10_fin, E14_fin, E11_fin, E16_fin, E9b_fin, E10b_fin, E2r_fin]}
  - {id: publish, kind: script, script: scripts/publish_results.py, args: [--tag, complete-server, --queue, queue/complete-server.yaml], after_failed: true, depends_on: [bundle]}
