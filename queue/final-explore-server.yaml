# The last compute run (2026-11-18): exploratory follow-ups to the final pass, all post hoc and labelled exploratory; none can
# change a preregistered answer (DECISIONS.md 2026-11-18, docs/FINAL_EXPLORE_RUNBOOK.md). Built to reuse gnode084's caches
# (stage-1 spans and stage-2 codes of the final pass, the E9/E10 DAS rotations), so run it on gnode084:
#   sbatch scripts/slurm_final.sbatch            (defaults: gnode084, 4 GPUs, this queue)
#   E17 DAS robustness (RS L18)            E18 rank up to 64 + DAS on people-cities     E19 steering dose 0.25-16
#   E20 illusion checks at 65k / 262k      E21 multilingual fidelity at 65k            E22 multilingual DAS transfer
# Estimated ~50 GPU-hours (about 13-15 h on 4 GPUs); new downloads ~8 GB (65k L12, 65k L18, 262k L12 for E20).
# (E21 at 262k was left out: on 11 GB GPUs a float32 262k SAE leaves room for only a few windows per batch.)
tag: final-explore-server
profile: server
parallel: true
prefetch:                       # SAEs that the E21 script jobs use without an experiment config naming them
  model_revision: c5ebcd40d208330abc697524c919956e692655cf
  saes: [[12, 16k, 82], [18, 16k, 74], [12, 65k, 72], [18, 65k, 64]]
jobs:
  - {id: prefetch, kind: script, script: scripts/run_prefetch.py, args: [--queue, queue/final-explore-server.yaml]}
  - {id: preflight, kind: script, script: scripts/run_preflight.py, gpu: all,
     args: [--queue, queue/final-explore-server.yaml, --golden, golden/R2, --per-gpu], depends_on: [prefetch]}

  # ---- stage 1 (cached from the final pass; chained so each entry has one writer)
  - {id: E17_s1, config: configs/experiments/E17.yaml, stage: "1", priority: 10, depends_on: [preflight]}
  - {id: E18_s1, config: configs/experiments/E18.yaml, stage: "1", priority: 9, depends_on: [E17_s1]}
  - {id: E19_s1, config: configs/experiments/E19.yaml, stage: "1", priority: 7, depends_on: [E18_s1]}
  - {id: E20_s1, config: configs/experiments/E20.yaml, stage: "1", priority: 8, depends_on: [E19_s1]}
  - {id: E22_s1, config: configs/experiments/E22.yaml, stage: "1", priority: 5, depends_on: [preflight]}

  # ---- stage 2 (new SAE codes only for E20's 65k / 262k cells)
  - {id: E17_s2, config: configs/experiments/E17.yaml, stage: "2", slices: auto, priority: 10, depends_on: [E17_s1]}
  - {id: E18_s2, config: configs/experiments/E18.yaml, stage: "2", slices: auto, priority: 9, depends_on: [E18_s1, E17_s2]}
  - {id: E19_s2, config: configs/experiments/E19.yaml, stage: "2", slices: auto, priority: 7, depends_on: [E19_s1, E18_s2]}
  - {id: E20_s2, config: configs/experiments/E20.yaml, stage: "2", slices: auto, priority: 8, depends_on: [E20_s1]}
  - {id: E22_s2, config: configs/experiments/E22.yaml, stage: "2", slices: auto, priority: 5, depends_on: [E22_s1]}

  # ---- stage 3 (claiming workers). E19 reads das8_e10 (trained by E17) and people-cities das8 (trained by E18)
  - {id: E17_s3, config: configs/experiments/E17.yaml, stage: "3", workers: auto, priority: 10, depends_on: [E17_s2]}
  - {id: E18_s3, config: configs/experiments/E18.yaml, stage: "3", workers: auto, priority: 9, depends_on: [E18_s2]}
  - {id: E20_s3, config: configs/experiments/E20.yaml, stage: "3", workers: auto, priority: 8, depends_on: [E20_s2]}
  - {id: E19_s3, config: configs/experiments/E19.yaml, stage: "3", workers: auto, priority: 7, depends_on: [E19_s2, E17_s3, E18_s3]}
  - {id: E22_s3, config: configs/experiments/E22.yaml, stage: "3", workers: auto, priority: 5, depends_on: [E22_s2]}

  # ---- E21: multilingual fidelity with wider SAEs at L0 matched to the 16k pilot variants (scripts/run_fidelity.py)
  - {id: E21_en, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 6, args: [--sets, "en_pilot100,en_pile", --layers, "12", "18", --width, 65k, --l0-rule, match16k], depends_on: [preflight]}
  - {id: E21_hi_deva_web, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 6, args: [--sets, hi_deva_web, --layers, "12", "18", --width, 65k, --l0-rule, match16k], depends_on: [preflight]}
  - {id: E21_fr_web, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 6, args: [--sets, fr_web, --layers, "12", "18", --width, 65k, --l0-rule, match16k], depends_on: [preflight]}
  - {id: E21_hinglish, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 6, args: [--sets, hinglish_phinc, --layers, "12", "18", --width, 65k, --l0-rule, match16k], depends_on: [preflight]}
  - {id: E21_hi_dakshina, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 6, args: [--sets, "hi_deva_dakshina,hi_latn_dakshina", --layers, "12", "18", --width, 65k, --l0-rule, match16k], depends_on: [preflight]}
  - {id: E21_ta_web, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 4, args: [--sets, ta_web, --layers, "12", "18", --width, 65k, --l0-rule, match16k], depends_on: [preflight]}
  - {id: E21_bn_web, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 4, args: [--sets, bn_web, --layers, "12", "18", --width, 65k, --l0-rule, match16k], depends_on: [preflight]}
  - {id: E21_ta_dakshina, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 4, args: [--sets, "ta_taml_dakshina,ta_latn_dakshina", --layers, "12", "18", --width, 65k, --l0-rule, match16k], depends_on: [preflight]}
  - {id: E21_bn_dakshina, kind: script, script: scripts/run_fidelity.py, gpu: one, priority: 4, args: [--sets, "bn_beng_dakshina,bn_latn_dakshina", --layers, "12", "18", --width, 65k, --l0-rule, match16k], depends_on: [preflight]}

  # ---- finalize (CPU)
  - {id: E17_fin, config: configs/experiments/E17.yaml, stage: "3", gpu: none, args: [--finalize-only], depends_on: [E17_s3]}
  - {id: E18_fin, config: configs/experiments/E18.yaml, stage: "3", gpu: none, args: [--finalize-only], depends_on: [E18_s3]}
  - {id: E19_fin, config: configs/experiments/E19.yaml, stage: "3", gpu: none, args: [--finalize-only], depends_on: [E19_s3]}
  - {id: E20_fin, config: configs/experiments/E20.yaml, stage: "3", gpu: none, args: [--finalize-only], depends_on: [E20_s3]}
  - {id: E22_fin, config: configs/experiments/E22.yaml, stage: "3", gpu: none, args: [--finalize-only], depends_on: [E22_s3]}

  - {id: bundle, kind: script, script: scripts/bundle_results.py, args: [--tag, final-explore-server, --queue, queue/final-explore-server.yaml], after_failed: true, depends_on: [E17_fin, E18_fin, E19_fin, E20_fin, E22_fin, E21_en, E21_hi_deva_web, E21_fr_web, E21_hinglish, E21_hi_dakshina, E21_ta_web, E21_bn_web, E21_ta_dakshina, E21_bn_dakshina]}
  - {id: publish, kind: script, script: scripts/publish_results.py, args: [--tag, final-explore-server, --queue, queue/final-explore-server.yaml], after_failed: true, depends_on: [bundle]}
